<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="expand-release" content="__EXPAND_RELEASE__">
<meta name="theme-color" content="#251d2b">
<meta name="description" content="Bolhas artísticas, Ecos e ensaios para ler no seu ritmo.">
<title>Expand</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./style.css?v=21">
<script src="./theme.js?v=14"></script>
<script type="module" src="./app.js?v=21"></script>
</head>
<body>
<header class="top">
  <button class="brand" data-view="feed" aria-label="Expand, início"><span class="mark" aria-hidden="true"></span>expand<span class="dot">.</span></button>
  <nav aria-label="Navegação principal">
    <button data-view="feed">Círculos</button>
    <button data-view="library">Biblioteca</button>
    <button data-view="create" class="create-tab">＋ Criar</button>
  </nav>
  <div class="top-tools">
    <button id="theme" class="quiet" type="button" aria-label="Ativar tema escuro" title="Ativar tema escuro"><span aria-hidden="true">☾</span></button>
    <button class="quiet" id="profile" data-view="profile">Perfil</button>
    <button class="quiet" id="settings" type="button" data-view="settings" aria-label="Configurações" title="Configurações"><span aria-hidden="true">⚙</span></button>
  </div>
  <button id="install" class="quiet" hidden>Instalar</button>
</header>
<div id="app-update" class="update-notice" role="status" hidden></div>
<main id="main" tabindex="-1"></main>
<footer class="source-notice">
  <span>© 2026 Zona Educacional</span>
  <a href="https://github.com/zonaeducacional/expand">Código-fonte do Expand</a>
  <a href="https://github.com/zonaeducacional/expand/blob/main/LICENSE">Licença AGPLv3</a>
  <span>Publicado sem garantia, nos termos da licença.</span>
</footer>
<dialog id="layers" aria-labelledby="layer-title"><div id="layer-content"></div></dialog>
<dialog id="create-dialog" aria-labelledby="create-title"></dialog>
<input id="import" type="file" accept=".zip,.json,application/zip,application/json" hidden>
<div id="status" role="status" aria-live="polite"></div>
</body>
</html>
